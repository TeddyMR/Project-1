schema_version: "1.1"
name: habeas-corpus-para-trancar-aij
expected_outcome: |
  Explica em uma frase que se tranca a ação penal e que a audiência é suspensa por liminar, apresenta o plano ou vai direto à minuta de habeas corpus dirigida ao tribunal com pedido de liminar para suspender a audiência e pedido de mérito de trancamento, fundamenta no art. 226 do CPP e em precedentes da base, deixa entre colchetes o que depende dos autos e entrega lista de conferência.
