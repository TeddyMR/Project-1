schema_version: "1.1"
name: analisa-flagrante-de-drogas
expected_outcome: |
  Explica em linguagem simples, começa pelo prazo da resposta à acusação calculado por regra, aponta a busca pessoal sem fundada suspeita, o ingresso em domicílio sem mandado, a confissão informal e a presunção de uso pessoal para até 40 g de maconha, cita só precedentes da base com suas ressalvas, não promete resultado e diz que a peça exige advogado ou defensor.
